services:
  reverse-proxy:
    image: nginx:alpine
    container_name: FCLens-RevProxy
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:z,ro
    ports:
      - "80:80"
      - "90:90"
    depends_on:
      - frontend
      - matomo-web
    networks:
      - frontend

  #
  # --- Backend ---
  #
  backend-db:
    image: mongo:latest
    container_name: FCLens-Backend-Db
    volumes:
      - mongodb_data:/data/db
    networks:
      - backend

  backend:
    image: ondsel-server-backend
    container_name: FCLens-Backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - HOSTNAME=backend
      - PORT=3030
      - DB_URL=mongodb://backend-db/fclens-db #:27017
      - FRONTEND_URL=frontend
      - FC_WORKER_URL=fc-worker-api+"/2015-03-31/functions/function/invocations"
      - SMTP_HOST
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER
      - SMTP_PASS
      - USE_S3
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_CLIENT_MODELS_BUCKET
      - AWS_REGION
      - DEFAULT_ADMIN_EMAIL
      - DEFAULT_ADMIN_USERNAME
      - DEFAULT_ADMIN_PASSWORD
      - DEFAULT_ADMIN_NAME
      - LOCAL_SIGNED_URL_SECRET
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - backend-db
    networks:
      - backend

  #
  # --- Frontend ---
  #
  frontend:
    image: ondsel-server-frontend
    container_name: FCLens-Frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_APP_API_URL=backend
        - VITE_MATOMO_URL=matomo-app:7000
        - VITE_MATOMO_SITE=${VITE_MATOMO_SITE:-1}
        - VITE_STRIPE_PURCHASE_PEER_URL
    depends_on:
      - backend
    networks:
      - frontend
      - backend

  #
  # --- FreeCAD ---
  #
  fc-worker-redis:
    image: redis:alpine
    container_name: FCLens-Worker-Cache
    networks:
      - backend

  fc-worker-api:
    image: ondsel-server-fc-worker-api
    container_name: FCLens-Worker-Api
    build:
      context: ./FC-Worker
      dockerfile: Dockerfile.api
    environment:
      - REDIS_HOST=fc-worker-redis
      - REDIS_PORT=6379
    depends_on:
      - backend
      - fc-worker-redis
    networks:
      - backend

  fc-worker-celery:
    image: ondsel-server-fc-worker-celery
    container_name: FCLens-Worker-Tasks
    build:
      context: ./FC-Worker
      dockerfile: Dockerfile.celery
    environment:
      - REDIS_HOST=fc-worker-redis
      - REDIS_PORT=6379
      - BACKEND_URL=backend:3030
    depends_on:
      - backend
      - fc-worker-redis
    networks:
      - backend

  #
  # --- Matomo ---
  # https://github.com/matomo-org/docker/blob/master/.examples/nginx/docker-compose.yml
  matomo-db:
    image: mariadb:lts
    container_name: FCLens-Matomo-Db
    command: --max-allowed-packet=64MB
    volumes:
      - matomo_db:/var/lib/mysql:Z
    environment:
      - MARIADB_ROOT_PASSWORD=matomo
      - MARIADB_AUTO_UPGRADE=1
      - MARIADB_DISABLE_UPGRADE_BACKUP=1
    env_file:
      - ./matomo/.env
    networks:
      - backend

  matomo-app:
    image: matomo:fpm-alpine
    container_name: FCLens-Matomo-App
    volumes:
      # - ./config:/var/www/html/config:z
      # - ./logs:/var/www/html/logs:z
      - matomo:/var/www/html:z
    environment:
      - MATOMO_DATABASE_HOST=matomo-db
      - PHP_MEMORY_LIMIT=2048M
      - MATOMO_USERNAME=admin
      - MATOMO_PASSWORD=admin@local.test
      - MATOMO_EMAIL=admin@local.test
    env_file:
      - ./matomo/.env
    depends_on:
      - matomo-db
    networks:
      - backend

  matomo-web:
    image: nginx:alpine
    container_name: FCLens-Matomo-Web
    volumes:
      - matomo:/var/www/html:z
      # see https://github.com/matomo-org/matomo-nginx
      - ./matomo/matomo-nginx.conf:/etc/nginx/conf.d/default.conf:z,ro
    depends_on:
      - matomo-app
    networks:
      - frontend
      - backend

#
# --- Networks ---
#
networks:
  frontend:
  backend:

    #
    # --- Volumes ---
    #
volumes:
  matomo:
  matomo_db:
  mongodb_data:
  uploads_data:
